# Release a Maven Central (Bloque 6).
# Se dispara con un tag vX.Y.Z. El POM tiene autoPublish=false: tras el deploy
# hay que aprobar la publicación manualmente en https://central.sonatype.com.
#
# Secretos requeridos en el repositorio:
#   CENTRAL_USERNAME / CENTRAL_PASSWORD : token de usuario del Central Portal
#   GPG_PRIVATE_KEY                     : clave privada ASCII-armored
#   GPG_PASSPHRASE                      : passphrase de la clave
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release   # permite exigir aprobación manual en GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # Genera settings.xml con el servidor 'central' (ver publishingServerId del POM)
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          # Importa la clave; la passphrase se lee de MAVEN_GPG_PASSPHRASE.
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify tag matches the POM version
        run: |
          POM_VERSION=$(mvn -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "POM=${POM_VERSION} TAG=${GITHUB_REF_NAME}"
          if [ "v${POM_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con la versión ${POM_VERSION} del POM."
            exit 1
          fi
          case "${POM_VERSION}" in
            *SNAPSHOT*) echo "No se publican SNAPSHOT en Central."; exit 1 ;;
          esac

      # Re-ejecuta toda la verificación (incluye IT y cobertura) antes de firmar.
      - name: Verify, sign and deploy
        run: mvn -B -ntp clean deploy -Pquality,release
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}